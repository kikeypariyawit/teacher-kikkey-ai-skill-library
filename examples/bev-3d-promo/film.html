{const fg=new THREE.SphereGeometry(.16,8,6),cols=[C.yellow,C.pink,C.white,C.red,C.purple];const per=60;cols.forEach((c,ci)=>{const im=new THREE.InstancedMesh(fg,std(c,.6),per);const m=new THREE.Matrix4();for(let i=0;i<per;i++){let x,z;do{const a=rnd()*Math.PI*2,r=3+rnd()*39;x=Math.cos(a)*r;z=Math.sin(a)*r;}while(Math.hypot(x-P.pond.x,z-P.pond.z)<POND_R+1.2);m.setPosition(x,.16,z);im.setMatrixAt(i,m);}scene.add(im);});}

    if(pu>0){const pw=340,phh=420,cx=(i%2)?W-220:220,cy=440;const sc=backOut(pu/.35)*smooth(rem/.16);ui.save();ui.translate(cx,cy);ui.rotate(((i%2)?1:-1)*.09*(1+.3*Math.sin(t*2)));ui.scale(sc,sc);
      ui.shadowColor='rgba(0,0,0,.35)';ui.shadowBlur=36;ui.shadowOffsetY=14;ui.fillStyle='#fff';rr(-pw/2,-phh/2,pw,phh,14);ui.fill();ui.shadowColor='transparent';
      const iw=pw-36,ih=phh-110,ar=im.width/im.height,tr=iw/ih;let sw=im.width,shh=im.height,sx0=0,sy0=0;if(ar>tr){sw=im.height*tr;sx0=(im.width-sw)/2;}else{shh=im.width/tr;sy0=(im.height-shh)/2;}
      ui.drawImage(im,sx0,sy0,sw,shh,-iw/2,-phh/2+18,iw,ih);txt(b.en,0,phh/2-46,'700 44px Fredoka','#2f9e63');ui.restore();}}
}

function drawCTA(t){const u=t-CUE.cta;if(u<0)return;
  const y0=1040+ (1-easeOut(u/.55))*900,x0=60,cw=W-120,ch=690;ui.save();
  ui.shadowColor='rgba(0,0,0,.28)';ui.shadowBlur=50;ui.shadowOffsetY=16;rr(x0,y0,cw,ch,64);ui.fillStyle='#ffffff';ui.fill();ui.shadowColor='transparent';
  rr(x0,y0,cw,ch,64);ui.clip();ui.fillStyle='#2f9e63';ui.fillRect(x0,y0,cw,150);
  txt('Bangyai English Village',W/2,y0+78,'700 66px Fredoka','#ffffff');
  txt('เล่นสนุกกลางแจ้ง',W/2,y0+238,'700 84px Kanit','#17324d');
  txt('ได้ฝึกภาษาอังกฤษไปด้วย',W/2,y0+334,'700 68px Kanit','#2f9e63');
  txt('เปิดทุกวันเสาร์–อาทิตย์ · ตรงข้ามเซ็นทรัล เวสต์เกต',W/2,y0+430,'500 38px Kanit','#52606d');
  const pu=u-.7,ps=backOut(pu/.4)*(1+.035*Math.sin(Math.max(0,pu)*5));
  pop(W/2,y0+560,Math.max(0,ps),()=>{rr(x0+70,y0+498,cw-140,124,62);ui.fillStyle='#ffc93c';ui.fill();txt('ทักเพจ Facebook เพื่อจองรอบ',W/2,y0+562,'700 56px Kanit','#17324d');});
  ui.restore();
  const a=smooth((u-.2)/.4);ui.save();ui.globalAlpha=a;txt('พาลูกออกจากจอ มาเจอกันนะ!',W/2,930,'700 70px Kanit','#ffffff','#17324d',18);ui.restore();
}

// ───────────────────────── seek ─────────────────────────
window.DUR=DUR;window.FPS=30;
window.seek=(t)=>{
  t=clamp(t,0,DUR);animate(t);scene.updateMatrixWorld(true);
  const s=shotAt(t),u=smooth((t-s.t0)/(Math.min(s.t1,DUR)-s.t0));
  camera.position.lerpVectors(s.a,s.b,s===SHOTS[0]?easeOut((t-s.t0)/(s.t1-s.t0)):u);camera.fov=s.fov;camera.updateProjectionMatrix();camera.lookAt(s.look());camera.updateMatrixWorld(true);
  renderer.render(scene,camera);
  ui.clearRect(0,0,W,H);
  drawHook(t);drawReveal(t);drawBrand(t);BEATS.forEach((b,i)=>drawBeat(b,t,i));drawCTA(t);
  // cut flash (2 frames) to soften hard cuts
  for(const c of [CUE.zip,CUE.boat,CUE.tramp,CUE.beam,CUE.dino,CUE.cta]){const d=t-c;if(d>=0&&d<.1){ui.fillStyle=`rgba(255,255,255,${.5*(1-d/.1)})`;ui.fillRect(0,0,W,H);}}
};
// preview: fit to window and play when opened by a person
if(!navigator.webdriver){const st=document.getElementById('stage');const f=()=>{st.style.transform=`scale(${Math.min(innerWidth/W,innerHeight/H)})`;};f();addEventListener('resize',f);const t0=performance.now();const loop=()=>{window.seek(((performance.now()-t0)/1000)%DUR);requestAnimationFrame(loop);};loop();}
else window.seek(0);
window.ready=true;
</script>
