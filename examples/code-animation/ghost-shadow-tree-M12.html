<!doctype html>
<html lang="th">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shadow Under the Tree · M12</title>
<!-- Style: M12 剪纸皮影 paper-cut shadow puppets (code-animation-prompts), turned toward Thai folk horror. 12 s, 9:16, silent preview. -->
<style>
  @font-face { font-family: 'Mali'; src: url('fonts/Mali-Regular.ttf'); font-weight: 400; }
  @font-face { font-family: 'Sriracha'; src: url('fonts/Sriracha-Regular.ttf'); }
  html, body { margin: 0; background: #0b0503; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
<canvas id="scene"></canvas>
<script>
// ---------- editable config ----------
const CONFIG = {
  duration: 12,
  captions: [
    { a: 0.6, b: 3.9, lines: ['เขาบอกว่า… อย่าเดินผ่าน', 'ต้นไม้ท้ายหมู่บ้านตอนกลางคืน'] },
    { a: 4.2, b: 7.3, lines: ['แต่คืนนั้น', 'เด็กชายต้องกลับบ้านคนเดียว'] },
    { a: 7.9, b: 10.4, lines: ['แล้วเงาที่สอง…', 'ก็ขยับเข้ามาใกล้'] },
  ],
  title: 'เงาใต้ต้นไม้',
  tagline: 'อย่าหันกลับไป…',
  ink: '#120905', lampHot: [255, 190, 110], lampEdge: [70, 24, 8], blood: [190, 40, 20], text: '#f3dcb4'
};
const W = 1080, H = 1920, GROUND = 1450;

const hash = (...n) => { let s = 0; n.forEach((v, i) => s += v * (12.9898 + i * 78.233)); const x = Math.sin(s) * 43758.5453; return x - Math.floor(x); };
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const ease = x => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
const mix = (a, b, k) => a.map((v, i) => Math.round(v + (b[i] - v) * k));
function rng(seed) { let s = seed >>> 0; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }

// ---------- cloth screen weave (fixed texture) ----------
const cloth = document.createElement('canvas'); cloth.width = W; cloth.height = H;
(function () {
  const g = cloth.getContext('2d'), d = g.createImageData(W, H), r = rng(11);
  for (let y = 0, i = 0; y < H; y++) for (let x = 0; x < W; x++, i += 4) {
    const weave = (x % 4 < 1 ? .5 : 0) + (y % 4 < 1 ? .5 : 0), v = 255 - (weave * 26 + r() * 18);
    d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255;
  }
  g.putImageData(d, 0, 0);
})();

// ---------- lamp behind the screen ----------
function lamp(t) {
  let I = .15 + .85 * ease(prog(t, 0, .9));
  I *= .92 + .08 * Math.sin(t * 9.1) * Math.sin(t * 3.7 + 1);                       // living flame
  const stepped = Math.floor(t * 12);
  if (t > 7.6 && t < 10.6 && hash(stepped, 3) < .33) I *= .35 + .3 * hash(stepped);  // the flame gutters when the ghost comes
  if (t >= 10.6) I = .04 + .2 * ease(prog(t, 11.0, 11.6));                           // blackout, then a dim ember for the title
  const red = clamp(prog(t, 7.8, 10.4) * .75 + (t >= 10.6 ? .9 : 0));
  return { I, red };
}
function drawScreen(g, L) {
  const hot = mix(CONFIG.lampHot, CONFIG.blood, L.red * .7), edge = mix(CONFIG.lampEdge, [40, 6, 4], L.red);
  const gr = g.createRadialGradient(540, 820, 40, 540, 900, 1100);
  gr.addColorStop(0, `rgb(${hot})`); gr.addColorStop(.55, `rgb(${mix(hot, edge, .55)})`); gr.addColorStop(1, `rgb(${edge})`);
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  g.globalCompositeOperation = 'multiply'; g.drawImage(cloth, 0, 0); g.globalCompositeOperation = 'source-over';
  g.fillStyle = `rgba(8,3,2,${1 - L.I})`; g.fillRect(0, 0, W, H);
}

// ---------- puppets (solid paper, then cut-out holes) ----------
const layer = document.createElement('canvas'), ghostL = document.createElement('canvas');
layer.width = ghostL.width = W; layer.height = ghostL.height = H;
const lg = layer.getContext('2d'), gg = ghostL.getContext('2d');

function cutHoles(g, pts) { g.globalCompositeOperation = 'destination-out'; pts.forEach(([x, y, r, k]) => {
  g.beginPath(); if (k) g.ellipse(x, y, r, r * .45, k, 0, 7); else g.arc(x, y, r, 0, 7); g.fill(); }); g.globalCompositeOperation = 'source-over'; }

function tree(g, t) {
  g.fillStyle = CONFIG.ink; g.strokeStyle = CONFIG.ink; g.lineCap = 'round';
  g.beginPath(); g.moveTo(680, GROUND); g.bezierCurveTo(735, 1200, 700, 900, 750, 640); g.lineTo(805, 640);
  g.bezierCurveTo(800, 900, 850, 1200, 880, GROUND); g.closePath(); g.fill();
  [[770, 760, 520, 560, 360, 520, 34], [790, 700, 900, 560, 1060, 470, 30], [770, 660, 690, 470, 600, 330, 24], [790, 650, 900, 420, 980, 300, 22]].forEach(([x0, y0, cx, cy, x1, y1, w]) => {
    g.lineWidth = w; g.beginPath(); g.moveTo(x0, y0); g.quadraticCurveTo(cx, cy, x1, y1); g.stroke(); });
  const r = rng(5);
  for (let i = 0; i < 26; i++) { const x = 380 + r() * 700, y = 200 + r() * 420, rr = 70 + r() * 70; g.beginPath(); g.ellipse(x, y, rr, rr * .62, r() - .5, 0, 7); g.fill(); }
  g.lineWidth = 3;                                                            // hanging roots sway
  for (let i = 0; i < 9; i++) { const x = 470 + i * 70, y = 560 + hash(i) * 60, len = 160 + hash(i, 2) * 200, sw = Math.sin(t * 1.3 + i) * 10;
    g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + sw, y + len * .5, x + sw * 1.6, y + len); g.stroke(); }
  // cloth sash tied round the trunk, tails fluttering
  g.beginPath(); g.moveTo(690, 1150); g.quadraticCurveTo(780, 1185, 868, 1150); g.lineTo(870, 1210); g.quadraticCurveTo(780, 1245, 692, 1210); g.closePath(); g.fill();
  [0, 1].forEach(k => { const f = Math.sin(t * 4 + k * 2) * 18; g.beginPath(); g.moveTo(860, 1170 + k * 22);
    g.quadraticCurveTo(920, 1170 + f + k * 30, 975, 1215 + f * 1.4 + k * 30); g.lineTo(968, 1235 + f * 1.4 + k * 30); g.quadraticCurveTo(915, 1200 + f + k * 30, 860, 1192 + k * 22); g.fill(); });
  const holes = [];
  for (let i = 0; i < 70; i++) holes.push([400 + r() * 640, 190 + r() * 420, 6 + r() * 9, r() * 3 + .1]);   // carved leaves
  for (let i = 0; i < 7; i++) holes.push([712 + i * 24, 1180 + Math.sin(i) * 3, 6, 0]);                     // sash pattern
  for (let i = 0; i < 5; i++) holes.push([760, 760 + i * 70, 5 + i % 2 * 3, 0]);                              // trunk carving
  cutHoles(g, holes);
}
function house(g) {
  g.fillStyle = CONFIG.ink;
  g.beginPath(); g.moveTo(40, 1150); g.lineTo(195, 960); g.lineTo(350, 1150); g.lineTo(325, 1150); g.lineTo(325, 1290); g.lineTo(65, 1290); g.lineTo(65, 1150); g.closePath(); g.fill();
  [80, 150, 240, 310].forEach(x => g.fillRect(x, 1290, 12, GROUND - 1290));
  g.fillRect(40, 1286, 300, 10); g.fillRect(185, 925, 8, 50);
  g.beginPath(); g.moveTo(330, 1290); g.lineTo(420, GROUND); g.lineTo(405, GROUND); g.lineTo(316, 1296); g.fill();           // stairs
  cutHoles(g, [[140, 1215, 28, 0], [255, 1215, 28, 0], [195, 1090, 18, 0]]);
}
function boy(g, t) {
  const walking = t < 7.4, x = 1180 - 780 * ease(prog(t, 2.4, 7.4)), pose = walking && t > 2.4 ? Math.floor(t * 8) % 2 : 0;
  const shake = t > 9.4 && t < 10.6 ? (hash(Math.floor(t * 24)) - .5) * 5 : 0, y = GROUND - pose * 6;
  g.save(); g.translate(x + shake, y); g.fillStyle = CONFIG.ink; g.strokeStyle = CONFIG.ink;
  g.lineWidth = 3; g.beginPath(); g.moveTo(10, -170); g.lineTo(-30, 480); g.stroke();                          // the puppet rod
  g.beginPath(); g.moveTo(-34, -230); g.lineTo(38, -230); g.lineTo(48, -110); g.lineTo(-44, -110); g.fill();  // body (facing left)
  const sw = pose ? 18 : -18;
  [[-18, sw], [20, -sw]].forEach(([lx, s]) => { g.beginPath(); g.moveTo(lx - 10, -112); g.lineTo(lx + 10, -112); g.lineTo(lx + s * .8 + 6, 0); g.lineTo(lx + s * .8 - 8, 0); g.fill(); });
  g.beginPath(); g.arc(0, -268, 40, 0, 7); g.fill();
  g.beginPath(); g.moveTo(-38, -270); g.lineTo(-52, -258); g.lineTo(-36, -252); g.fill();                     // nose
  const drop = t > 9.4 ? 30 * ease(prog(t, 9.4, 10.0)) : 0;
  g.lineWidth = 9; g.beginPath(); g.moveTo(-20, -200); g.lineTo(-90, -230 + drop); g.stroke();                 // arm + lantern pole
  g.lineWidth = 4; g.beginPath(); g.moveTo(-90, -230 + drop); g.lineTo(-150, -260 + drop); g.lineTo(-150, -215 + drop); g.stroke();
  g.beginPath(); g.roundRect(-176, -215 + drop, 52, 66, 14); g.fill();
  cutHoles(g, [[-16, -278, 7, 0], [-150, -190 + drop, 9, 0], [-163, -170 + drop, 4, 0], [-137, -170 + drop, 4, 0], [0, -175, 6, 0]]);
  g.restore();
}
function ghost(g, t) {
  if (t < 7.6) return { blur: 0 };
  const k = ease(prog(t, 7.6, 9.4)), slide = ease(prog(t, 9.3, 10.6));
  const s = 1.9 - .9 * k, blur = 26 * (1 - k) + 1.2, x = 760 - 170 * slide;               // close to the lamp: huge and soft; nearer the screen: sharp
  g.save(); g.translate(x, GROUND + 60 * (1 - k)); g.scale(s, s); g.fillStyle = CONFIG.ink;
  const sway = Math.sin(t * 2.2) * 6;
  g.beginPath(); g.moveTo(-70, 0); g.quadraticCurveTo(-60, -200, -40, -330); g.lineTo(40, -330); g.quadraticCurveTo(60, -200, 76, 0); g.closePath(); g.fill();  // long dress
  g.beginPath(); g.arc(0, -385, 40, 0, 7); g.fill();
  g.beginPath(); g.moveTo(-46, -400);                                                     // hair to the waist, drifting
  for (let i = 0; i <= 10; i++) g.lineTo(-58 - Math.sin(i * .9 + t * 3) * 6 + sway * (i / 10), -400 + i * 34);
  for (let i = 10; i >= 0; i--) g.lineTo(-20 + Math.sin(i * .7 + t * 2.5) * 5 + sway * (i / 10), -400 + i * 34);
  g.fill();
  const reach = ease(prog(t, 9.6, 10.6));
  g.lineWidth = 10; g.lineCap = 'round'; g.strokeStyle = CONFIG.ink;
  g.beginPath(); g.moveTo(-30, -300); g.quadraticCurveTo(-90, -270, -100 - 70 * reach, -250 + 10 * reach); g.stroke();
  for (let f = 0; f < 4; f++) { g.lineWidth = 3; g.beginPath(); g.moveTo(-100 - 70 * reach, -250 + 10 * reach); g.lineTo(-128 - 70 * reach - f * 2, -262 + f * 9 + 10 * reach); g.stroke(); }
  cutHoles(g, [[-14, -392, 5, 0]]);                                                       // one carved eye catches the lamp
  g.restore();
  return { blur };
}

const canvas = document.getElementById('scene'), ctx = canvas.getContext('2d');
const frame = document.createElement('canvas'); frame.width = W; frame.height = H; const fg = frame.getContext('2d');

function caption(g, c, t) {
  const a = Math.min(prog(t, c.a, c.a + .4), 1 - prog(t, c.b - .4, c.b)); if (a <= 0) return;
  g.globalAlpha = a; g.fillStyle = CONFIG.text; g.textAlign = 'center'; g.font = '400 50px Mali';
  g.shadowColor = 'rgba(0,0,0,.8)'; g.shadowBlur = 12;
  c.lines.forEach((l, i) => g.fillText(l, 540, 1610 + i * 72)); g.shadowBlur = 0; g.globalAlpha = 1;
}
function draw(t) {
  canvas.width = innerWidth; canvas.height = innerHeight;
  const L = lamp(t);
  drawScreen(fg, L);
  // the ghost puppet sits on its own layer so it can be soft (near the lamp) while the rest stays sharp
  gg.clearRect(0, 0, W, H); const gh = ghost(gg, t);
  if (gh.blur) { fg.filter = `blur(${gh.blur}px)`; fg.drawImage(ghostL, 0, 0); fg.filter = 'none'; }
  lg.clearRect(0, 0, W, H); tree(lg, t); house(lg); boy(lg, t);
  fg.filter = 'blur(1.2px)'; fg.drawImage(layer, 0, 0); fg.filter = 'none';
  // stage floor + vignette
  const fl = fg.createLinearGradient(0, GROUND - 10, 0, H); fl.addColorStop(0, '#0b0503'); fl.addColorStop(1, '#050202');
  fg.fillStyle = fl; fg.fillRect(0, GROUND, W, H - GROUND);
  const v = fg.createRadialGradient(540, 860, 500, 540, 900, 1250); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.65)');
  fg.fillStyle = v; fg.fillRect(0, 0, W, H);
  CONFIG.captions.forEach(c => caption(fg, c, t));
  if (t > 10.9) {
    const a = ease(prog(t, 10.9, 11.6));
    fg.globalAlpha = a; fg.textAlign = 'center'; fg.fillStyle = '#e8a070'; fg.shadowColor = 'rgba(200,50,20,.9)'; fg.shadowBlur = 40;
    fg.font = '128px Sriracha'; fg.fillText(CONFIG.title, 540 + (hash(Math.floor(t * 12)) - .5) * 3, 900);
    fg.shadowBlur = 10; fg.fillStyle = CONFIG.text; fg.font = '400 54px Mali'; fg.fillText(CONFIG.tagline, 540, 1010);
    fg.shadowBlur = 0; fg.globalAlpha = 1;
  }
  ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0); ctx.drawImage(frame, 0, 0);
}
let fontsReady = null;
function ensureFonts() { return fontsReady ||= Promise.all([document.fonts.load('400 40px Mali'), document.fonts.load('40px Sriracha')]); }
window.renderAt = async t => { await ensureFonts(); draw(t); };
const q = new URLSearchParams(location.search);
if (q.has('t')) window.renderAt(Number(q.get('t')) || 0);
else if (!q.has('export')) ensureFonts().then(() => { const st = performance.now(); (function loop(now) { draw(((now - st) / 1000) % CONFIG.duration); requestAnimationFrame(loop); })(st); });
</script>
</html>
